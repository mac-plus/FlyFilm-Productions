<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCFYEST3SH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-YCFYEST3SH");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="flyfilm.gr live portfolio: fast cinematic project browsing with direct contact."
    />
    <title>flyfilm.gr // Live Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Teko:wght@300;500;600&display=swap"
    />
    <link rel="preload" href="./styles.css" as="style" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#menuScroller">Skip to portfolio menu</a>

    <div id="preloader" aria-hidden="true">
      <div class="loader-content">
        <div class="fly-logo">FLY FILM</div>
        <div class="loader-bar-track">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">
        &times;
      </button>
      <img id="lightbox-img" src="" alt="Expanded project still" />
    </div>

    <div class="lang-toggle-container" id="langToggle" aria-label="Language switcher">
      <button class="lang-pill active" id="pill-en" data-lang="en" type="button">EN</button>
      <button class="lang-pill" id="pill-el" data-lang="el" type="button">EL</button>
    </div>

    <div class="atmosphere-layer" aria-hidden="true">
      <video id="atmosphereVideo" autoplay loop muted playsinline preload="metadata"></video>
    </div>

    <main class="world-container">
      <section class="menu-layer">
        <div class="snap-container" id="menuScroller" role="tablist" aria-label="Project categories">
          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="mtb"
            data-title-en="Mountain Bike"
            data-desc-en="High altitude trails. FPV speed tracking."
            data-title-el="ΟΡΕΙΝΗ ΠΟΔΗΛΑΣΙΑ"
            data-desc-el="ΚΑΤΑΒΑΣΕΙΣ ΥΨΗΛΗΣ ΤΑΧΥΤΗΤΑΣ. ΚΙΝΗΜΑΤΟΓΡΑΦΗΣΗ FPV."
          >
            <span class="index-num">/// 01</span>
            <h2 data-lang-key="menu_mtb">Mountain Bike</h2>
          </button>

          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="mx"
            data-title-en="Moto Cross"
            data-desc-en="Dirt, mud, and airtime. Race chaos."
            data-title-el="MOTOCROSS"
            data-desc-el="ΧΩΜΑ ΚΑΙ ΑΛΜΑΤΑ. Η ΕΝΤΑΣΗ ΤΟΥ ΑΓΩΝΑ ΑΠΟ ΨΗΛΑ."
          >
            <span class="index-num">/// 02</span>
            <h2 data-lang-key="menu_mx">Moto Cross</h2>
          </button>

          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="concerts"
            data-title-en="Live Concerts"
            data-desc-en="Stadium energy from the sky."
            data-title-el="ΣΥΝΑΥΛΙΕΣ"
            data-desc-el="Η ΕΝΕΡΓΕΙΑ ΤΟΥ ΣΤΑΔΙΟΥ ΚΑΙ ΤΟΥ ΚΟΙΝΟΥ."
          >
            <span class="index-num">/// 03</span>
            <h2 data-lang-key="menu_concerts">Live Concerts</h2>
          </button>

          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="docu"
            data-title-en="Documentaries"
            data-desc-en="Cinematic narrative shots."
            data-title-el="ΝΤΟΚΙΜΑΝΤΕΡ"
            data-desc-el="ΚΙΝΗΜΑΤΟΓΡΑΦΙΚΗ ΑΦΗΓΗΣΗ ΚΑΙ ΤΟΠΙΑ."
          >
            <span class="index-num">/// 04</span>
            <h2 data-lang-key="menu_docu">Documentaries</h2>
          </button>

          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="misc"
            data-title-en="Uncategorised"
            data-desc-en="Experimental VFX and raw clips."
            data-title-el="ΔΙΑΦΟΡΑ PROJECTS"
            data-desc-el="ΠΕΙΡΑΜΑΤΙΚΑ VFX ΚΑΙ ΑΚΑΤΕΡΓΑΣΤΑ ΠΛΑΝΑ."
          >
            <span class="index-num">/// 05</span>
            <h2 data-lang-key="menu_misc">Uncategorised</h2>
          </button>

          <button
            class="slide"
            type="button"
            role="tab"
            aria-selected="false"
            data-type="contact"
            data-title-en="Contact Me"
            data-desc-en="Get in touch via our secure comms."
            data-title-el="ΕΠΙΚΟΙΝΩΝΙΑ"
            data-desc-el="Επικοινωνήστε μαζί μου μέσω της φόρμας."
          >
            <span class="index-num">/// 06</span>
            <h2 data-lang-key="menu_contact">Contact Me</h2>
          </button>
        </div>
      </section>

      <section class="project-layer" aria-live="polite">
        <button class="back-btn" id="closeBtn" data-lang-key="btn_back" type="button">
          &larr; BACK
        </button>

        <div class="proj-video-container" id="videoContainer"></div>

        <div class="proj-details">
          <div class="show-if-project">
            <span class="index-num" data-lang-key="label_selected">/// SELECTED</span>
            <h2 id="projTitle">TITLE</h2>
            <p id="projDesc">Description</p>
            <div class="matrix-grid" id="matrixGrid"></div>
          </div>

          <div class="show-if-contact">
            <h2 data-lang-key="form_title">START MISSION</h2>
            <form id="integrated-form" class="automation-form">
              <label for="nameInput" data-lang-key="form_name">Name</label>
              <input id="nameInput" type="text" name="name" required />

              <label for="emailInput" data-lang-key="form_email">Email</label>
              <input id="emailInput" type="email" name="email" required />

              <label for="messageInput" data-lang-key="form_msg">Message</label>
              <textarea id="messageInput" name="message" rows="4"></textarea>

              <button type="submit" data-lang-key="form_submit">INITIATE LAUNCH</button>
              <p class="form-status" id="formStatus" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
