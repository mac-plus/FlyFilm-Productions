<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCFYEST3SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-YCFYEST3SH");
  </script>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta
    name="description"
    content="flyfilm.gr live portfolio with cinematic categories, bilingual interface, and immersive project views."
  >
  <title>flyfilm.gr // Live Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Teko:wght@300;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="preload" href="./styles.css" as="style">
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div id="preloader" aria-hidden="true">
    <div class="loader-content">
      <div class="fly-logo">FLY FILM</div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="lightbox" aria-hidden="true" role="dialog" aria-label="Expanded project still">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image preview">
      ×
    </button>
    <img id="lightbox-img" src="" alt="Enlarged project still">
  </div>

  <div class="lang-toggle-container" id="langToggle" aria-label="Language selector">
    <button class="lang-pill active" id="pill-en" type="button" data-lang="en">EN</button>
    <button class="lang-pill" id="pill-el" type="button" data-lang="el">EL</button>
  </div>

  <div class="atmosphere-layer" aria-hidden="true">
    <video id="atmosphereVideo" autoplay loop muted playsinline preload="metadata"></video>
  </div>

  <div class="world-container">
    <div class="menu-layer">
      <div class="snap-container" id="menuScroller">
        <div
          class="slide"
          data-type="mtb"
          data-title-en="Mountain Bike"
          data-desc-en="High altitude trails. FPV Speed Tracking."
          data-title-el="ΟΡΕΙΝΗ ΠΟΔΗΛΑΣΙΑ"
          data-desc-el="ΚΑΤΑΒΑΣΕΙΣ ΥΨΗΛΗΣ ΤΑΧΥΤΗΤΑΣ. ΚΙΝΗΜΑΤΟΓΡΑΦΗΣΗ FPV."
          role="button"
          tabindex="0"
          aria-label="Open Mountain Bike project category"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 01</span>
              <h2 data-lang-key="menu_mtb">Mountain Bike</h2>
            </div>
          </div>
        </div>

        <div
          class="slide"
          data-type="mx"
          data-title-en="Moto Cross"
          data-desc-en="Dirt, mud, and airtime. Race chaos."
          data-title-el="MOTOCROSS"
          data-desc-el="ΧΩΜΑ ΚΑΙ ΑΛΜΑΤΑ. Η ΕΝΤΑΣΗ ΤΟΥ ΑΓΩΝΑ ΑΠΟ ΨΗΛΑ."
          role="button"
          tabindex="0"
          aria-label="Open Moto Cross project category"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 02</span>
              <h2 data-lang-key="menu_mx">Moto Cross</h2>
            </div>
          </div>
        </div>

        <div
          class="slide"
          data-type="concerts"
          data-title-en="Live Concerts"
          data-desc-en="Stadium energy from the sky."
          data-title-el="ΣΥΝΑΥΛΙΕΣ"
          data-desc-el="Η ΕΝΕΡΓΕΙΑ ΤΟΥ ΣΤΑΔΙΟΥ ΚΑΙ ΤΟΥ ΚΟΙΝΟΥ."
          role="button"
          tabindex="0"
          aria-label="Open Live Concerts project category"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 03</span>
              <h2 data-lang-key="menu_concerts">Live Concerts</h2>
            </div>
          </div>
        </div>

        <div
          class="slide"
          data-type="docu"
          data-title-en="Documentaries"
          data-desc-en="Cinematic narrative shots."
          data-title-el="ΝΤΟΚΙΜΑΝΤΕΡ"
          data-desc-el="ΚΙΝΗΜΑΤΟΓΡΑΦΙΚΗ ΑΦΗΓΗΣΗ ΚΑΙ ΤΟΠΙΑ."
          role="button"
          tabindex="0"
          aria-label="Open Documentaries project category"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 04</span>
              <h2 data-lang-key="menu_docu">Documentaries</h2>
            </div>
          </div>
        </div>

        <div
          class="slide"
          data-type="misc"
          data-title-en="Uncategorised"
          data-desc-en="Experimental VFX and raw clips."
          data-title-el="ΔΙΑΦΟΡΑ PROJECTS"
          data-desc-el="ΠΕΙΡΑΜΑΤΙΚΑ VFX ΚΑΙ ΑΚΑΤΕΡΓΑΣΤΑ ΠΛΑΝΑ."
          role="button"
          tabindex="0"
          aria-label="Open miscellaneous project category"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 05</span>
              <h2 data-lang-key="menu_misc">UnCategorised</h2>
            </div>
          </div>
        </div>

        <div
          class="slide"
          data-type="contact"
          data-title-en="Contact Me"
          data-desc-en="Get in touch via our secure comms."
          data-title-el="ΕΠΙΚΟΙΝΩΝΙΑ"
          data-desc-el="Επικοινωνήστε μαζί μου μέσω της φόρμας."
          role="button"
          tabindex="0"
          aria-label="Open contact form"
        >
          <div class="content-row">
            <div class="text-group">
              <span class="index-num">/// 06</span>
              <h2 data-lang-key="menu_contact">Contact Me</h2>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="project-layer">
      <button class="back-btn" id="closeBtn" type="button" data-lang-key="btn_back">← BACK</button>

      <div class="proj-video-container" id="videoContainer"></div>

      <div class="proj-details">
        <div class="show-if-project">
          <span class="index-num" data-lang-key="label_selected">/// SELECTED</span>
          <h2 id="projTitle" class="project-title">TITLE</h2>
          <p id="projDesc" class="project-desc">Desc</p>
          <div class="matrix-grid" id="matrixGrid"></div>
        </div>

        <div class="show-if-contact">
          <h2 class="contact-title" data-lang-key="form_title">START MISSION</h2>
          <form id="integrated-form" class="automation-form">
            <label data-lang-key="form_name" for="contact-name">Name</label>
            <input id="contact-name" type="text" name="name" required>
            <label data-lang-key="form_email" for="contact-email">Email</label>
            <input id="contact-email" type="email" name="email" required>
            <label data-lang-key="form_msg" for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="4"></textarea>
            <button type="submit" data-lang-key="form_submit">INITIATE LAUNCH</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
